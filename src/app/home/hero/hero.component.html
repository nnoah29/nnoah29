<section id="home" class="main-hero-area" #heroSection (mousemove)="onMouseMove($event)">

    <!-- Infinite Grid: dim base layer (always visible) -->
    <div class="grid-layer grid-dim" aria-hidden="true">
        <svg class="grid-svg">
            <defs>
                <pattern id="grid-pattern-base" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="2" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-pattern-base)" />
        </svg>
    </div>

    <!-- Infinite Grid: cursor-reveal layer (masked by radial gradient) -->
    <div class="grid-layer grid-reveal" aria-hidden="true" [style.mask-image]="radialMask"
        [style.-webkit-mask-image]="radialMask">
        <svg class="grid-svg">
            <defs>
                <pattern id="grid-pattern-reveal" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="2" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-pattern-reveal)" />
        </svg>
    </div>

    <!-- Ambient glow blobs -->
    <div class="glow-container" aria-hidden="true">
        <div class="ambient-glow glow-orange"></div>
        <div class="ambient-glow glow-blue"></div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="hero-content wow fadeInUp text-center delay-0-2s" #heroTitle>
                    <h2>N<span class="firstname photo-o">o</span>ah <span class="firstname">TOFFA</span></h2>
                </div>
            </div>
        </div>
        <div class="row row-2">
            <div class="col-lg-3 nido" #heroLeft>
                <div class="d-flex flex-column">
                    <div class="hero-content wow fadeInUp delay-0-2s">
                        <span class="">
                            BUILDING SYSTEMS. <br> NOT JUST APPS.
                        </span>
                    </div>

                    <div class="hero-content wow fadeInUp delay-0-2s">
                        <a class="theme-btn cv" href="assets/cv_noah_toffa_fr.pdf">Get my CV</a>
                    </div>
                </div>

            </div>
            <div class="col-lg-6 me">
                <div class="hero-image" #heroImg><img src="../../../assets/images/about/me_nb.png" alt=""></div>
            </div>
            <div class="col-lg-3" #heroRight>
                <div class="hero-content wow fadeInUp delay-0-4s story">
                    <p> <span class="iam">i am a</span> <span class="title">Software Engineer</span> <br>
                        AI-driven. Performance-focused. Designing intelligent systems and user experiences.</p>
                </div>
            </div>
        </div>
    </div>

</section>

<div class="glowing-divider"></div>
