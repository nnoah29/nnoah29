<div class="projects-area" id="portfolio">
    <div class="custom-icon" #customIcon><img src="assets/images/custom/work-scribble.svg" alt="custom"></div>
    <div class="container-fluid">

        <!-- Loading State -->
        <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading projects...</span>
            </div>
            <p class="mt-3">Fetching projects from GitHub...</p>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !loading" class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Error loading projects</h4>
            <p>{{ error }}</p>
            <hr>
            <p class="mb-0">
                <button class="btn btn-outline-danger" (click)="loadProjects()">Retry</button>
            </p>
        </div>

        <!-- Projects Grid -->
        <div *ngIf="!loading && !error" class="row g-4 portfolio-grid" #portfolioGrid>
            <div *ngFor="let project of projects; let i = index" class="col-md-6" [class.col-xl-6]="i < 2"
                [class.col-xl-4]="i >= 2">

                <a [href]="project.homepage || project.url" [target]="project.homepage ? '_blank' : '_self'"
                    class="portfolio-item">
                    <div class="portfolio-box">
                        <img [src]="getImageSrc(project)" [alt]="project.name" data-rjs="2">

                        <span class="portfolio-category">
                            {{ project.category || 'Development' }}
                        </span>

                        <div class="portfolio-caption">
                            <h1>{{ project.name }}</h1>
                            <p *ngIf="project.description" class="project-description">
                                {{ project.description }}
                            </p>

                            <div class="project-meta">
                                <span *ngIf="project.stars > 0" class="stars">
                                    ⭐ {{ project.stars }}
                                </span>
                                <span *ngIf="project.technologies.length > 0" class="technologies">
                                    {{ project.technologies.join(', ') }}
                                </span>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Refresh Button -->
        <div *ngIf="!loading && !error && projects.length > 0" class="text-center mt-4">
            <button class="btn btn-outline-primary" (click)="refreshProjects()">
                🔄 Refresh Projects
            </button>
        </div>
    </div>
</div>
