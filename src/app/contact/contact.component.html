<section id="contact" class="contact-area">
    <div class="container">
        <div class="row">
            <div class="col-xl-12 col-lg-12">
                <div class="section-title section-black-title wow fadeInUp delay-0-2s"><h2>Contact Me</h2></div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-4">
                <div class="contact-content-part wow fadeInUp delay-0-2s">
                    <div class="single-contact wow fadeInUp" data-wow-delay=".2s"><span class="circle-btn"><i
                            class="ri-map-pin-line"></i></span>
                        <h2>our office:</h2>
                        <p>Jurain,Dhaka Bangladesh</p></div>
                    <div class="single-contact wow fadeInUp" data-wow-delay=".4s"><span class="circle-btn"><i
                            class="ri-headphone-line"></i></span>
                        <h2>contact number:</h2>
                        <p>+1234321321</p></div>
                    <div class="single-contact wow fadeInUp" data-wow-delay=".6s"><span class="circle-btn"><i
                            class="ri-mail-line"></i></span>
                        <h2>Email us:</h2>
                        <p>websitename/mail.com</p></div>
                    <div class="single-contact wow fadeInUp" data-wow-delay=".6s"><h2>Socials</h2>
                        <div class="about-social">
                            <ul>
                                <li><a href="index.html"><i class="ri-facebook-circle-fill"></i></a></li>
                                <li><a href="index.html"><i class="ri-twitter-x-line"></i></a></li>
                                <li><a href="index.html"><i class="ri-linkedin-fill"></i></a></li>
                                <li><a href="index.html"><i class="ri-github-line"></i></a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="contact-form contact-form-area wow fadeInUp delay-0-4s">
                    <form id="contactForm" class="contact-form" action="index.html#" method="post">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group"><label for="name">Full Name</label><input type="text" id="name"
                                                                                                  class="form-control"
                                                                                                  value=""
                                                                                                  placeholder="Steve Milner"
                                                                                                  required=""
                                                                                                  data-error="Please enter your Name"><label
                                        for="name" class="for-icon"><i class="far fa-user"></i></label>
                                    <div class="help-block with-errors"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group"><label for="email">Email Address</label><input type="email"
                                                                                                       id="email"
                                                                                                       class="form-control"
                                                                                                       value=""
                                                                                                       placeholder="hello@websitename.com"
                                                                                                       required=""
                                                                                                       data-error="Please enter your Email"><label
                                        for="email" class="for-icon"><i class="far fa-envelope"></i></label>
                                    <div class="help-block with-errors"></div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group"><label for="name">Subject</label><input type="text" id="subject"
                                                                                                class="form-control"
                                                                                                value=""
                                                                                                placeholder="Your Subject"
                                                                                                required=""
                                                                                                data-error="Please enter your Name"><label
                                        for="name" class="for-icon"><i class="far fa-user"></i></label>
                                    <div class="help-block with-errors"></div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group"><label for="message">Your Message</label><textarea
                                        name="message" id="message" class="form-control" rows="4"
                                        placeholder="Write Your message" required=""
                                        data-error="Please Write your Message"></textarea>
                                    <div class="help-block with-errors"></div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group mb-0">
                                    <button type="submit" class="theme-btn">Send Me Message<i class="ri-mail-line"></i>
                                    </button>
                                    <div id="msgSubmit" class="hidden"></div>
                                </div>
                            </div>
                            <div class="col-md-12 text-center"><p class="input-success">We have received your mail, We
                                will get back to you soon!</p>
                                <p class="input-error">Sorry, Message could not send! Please try again.</p></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
