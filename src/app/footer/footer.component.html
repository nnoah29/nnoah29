<footer class="main-footer" (mousemove)="onMouseMove($event)">

    <!-- Infinite Grid: dim base layer (always visible) -->
    <div class="grid-layer grid-dim" aria-hidden="true">
        <svg class="grid-svg">
            <defs>
                <pattern id="grid-pattern-base-footer" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-pattern-base-footer)" />
        </svg>
    </div>

    <!-- Infinite Grid: cursor-reveal layer (masked by radial gradient) -->
    <div class="grid-layer grid-reveal" aria-hidden="true" [style.mask-image]="radialMask"
        [style.-webkit-mask-image]="radialMask">
        <svg class="grid-svg">
            <defs>
                <pattern id="grid-pattern-reveal-footer" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-pattern-reveal-footer)" />
        </svg>
    </div>

    <!-- Ambient glow blobs -->
    <div class="glow-container" aria-hidden="true">
        <div class="ambient-glow glow-gold"></div>
        <div class="ambient-glow glow-dark"></div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="footer-top">
                    <p>Have a project in mind?</p>
                    <h2><a href="mailto:hello@websitename.com"><span class="firstname">let's</span> work</a></h2>
                </div>
            </div>
        </div>

    </div>
</footer>
